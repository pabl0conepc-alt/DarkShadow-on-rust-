# DarkShadow's Shell (Rust) for Hyprland before 0.55 (hyprlang config).
# Add `source = ~/.config/hypr/dshell.conf` to hyprland.conf. (Hyprland 0.55+ uses dshell.lua instead.)

exec-once = dshell

# blur behind the shell's glass (0.53+ write: layerrule = match:namespace dshell-bar, blur on)
layerrule = blur, ^(dshell-(bar|island|launcher|control|power|picker|widget))$
layerrule = ignorealpha 0.25, ^(dshell-(bar|island|launcher|control|power|picker|widget))$
layerrule = noanim, ^(dshell-(wallpaper|island|launcher|control|power|picker|viz))$

bind = ALT, Space, exec, dshell toggle launcher
bind = SUPER, R, exec, dshell toggle launcher
bind = SUPER, N, exec, dshell toggle control
bind = SUPER, A, exec, dshell toggle control
bind = SUPER, W, exec, dshell toggle picker
bind = SUPER ALT, W, exec, dshell edit
bind = SUPER ALT, D, exec, dshell toggle today
bind = SUPER, U, exec, dshell toggle settings
bind = SUPER, G, exec, dshell gaming
bind = CTRL ALT, Delete, exec, dshell toggle power
bind = SUPER, L, exec, dshell lock

bindel = , XF86AudioRaiseVolume, exec, dshell volume up
bindel = , XF86AudioLowerVolume, exec, dshell volume down
bindl = , XF86AudioMute, exec, dshell volume mute
bindl = , XF86AudioMicMute, exec, dshell mic mute
bindel = , XF86MonBrightnessUp, exec, dshell brightness up
bindel = , XF86MonBrightnessDown, exec, dshell brightness down
bindl = , XF86AudioPlay, exec, dshell media play-pause
bindl = , XF86AudioPause, exec, dshell media play-pause
bindl = , XF86AudioNext, exec, dshell media next
bindl = , XF86AudioPrev, exec, dshell media prev
